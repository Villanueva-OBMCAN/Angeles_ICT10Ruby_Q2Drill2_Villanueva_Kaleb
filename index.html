     <style>
        body {
            font-family: Tahoma, Arial;
            background: linear-gradient(to right, #dbeafe, #eff6ff);
            text-align: center;
            padding: 40px;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1e40af;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

        #results {
            margin-top: 25px;
            text-align: left;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }

        #results h3 {
            color: #1e40af;
        }

        #results p {
            color: #334155;
            line-height: 1.6;
        }

        hr {
            border: 1px solid #dbeafe;
        }
    </style>
</head>
